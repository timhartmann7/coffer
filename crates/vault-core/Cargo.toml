[package]
name = "vault-core"
description = "KDBX 4.1 vault engine: format, domain model and file handling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[dependencies]
keepass = { version = "=0.13.25", features = ["save_kdbx4"] }
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rust-argon2 = "3"
sha2 = "0.11"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
base64 = "0.23"
proptest = "1"
quick-xml = "0.42"
tempfile = "3"

[[test]]
name = "vault"
path = "tests/vault/main.rs"

[lints]
workspace = true
