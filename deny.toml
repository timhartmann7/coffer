[graph]
all-features = false
# Coffer ships two builds and no others. Checking the graph of a platform it is
# never built for would fail on crates that are not in the application at all:
# the Linux side of the webview pulls a whole HTTP stack that never reaches a
# Mac.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"

# Every crate of the rust-unic family is unmaintained. They reach Coffer through
# `urlpattern`, which `tauri-utils` uses to match a capability against a URL, and
# no version of Tauri is without them. Nothing here is a vulnerability, there is
# no upgrade, and the alternative to accepting them is a different webview
# toolchain. Anything else unmaintained still fails the build.
ignore = [
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # File-level copyleft, and none of these files are modified. It arrives with
    # the webview: the HTML rewriter Tauri uses to hash inline scripts parses CSS
    # selectors, and the crate that finds the user's directories parses paths.
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Coffer makes no network requests, ever. Nothing that can open a socket is
# allowed into the dependency graph, and neither is anything that would give a
# transitive dependency a reason to try.
deny = [
    { name = "attohttpc" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "isahc" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "reqwest" },
    { name = "rustls" },
    { name = "socket2" },
    { name = "surf" },
    { name = "tungstenite" },
    { name = "ureq" },
]

# Two crates that can be part of a network stack arrive with the webview and
# cannot be refused outright.
#
# `tokio` is the runtime Tauri runs commands on. Its socket types live behind
# the `net` feature, which is denied here, so what is compiled into Coffer is
# the scheduler and nothing that can connect to anything.
#
# `url` is a parser for a syntax, not a client for it. It comes from Tauri's own
# configuration handling and opens nothing.
[[bans.features]]
crate = "tokio"
deny = ["net", "process", "signal"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
