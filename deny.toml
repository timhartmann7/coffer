[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Coffer makes no network requests, ever. Nothing that can open a socket is
# allowed into the dependency graph, and neither is anything that would give a
# transitive dependency a reason to try.
deny = [
    { name = "attohttpc" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "isahc" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "reqwest" },
    { name = "rustls" },
    { name = "socket2" },
    { name = "surf" },
    { name = "tokio" },
    { name = "tungstenite" },
    { name = "ureq" },
    { name = "url" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
