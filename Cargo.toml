[workspace]
members = ["crates/vault-core", "crates/vault-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
strip = true
lto = true
codegen-units = 1

# Unwinding is kept on purpose. The parser has reachable panics on a corrupt
# database, and vault-core turns them into an error rather than letting a
# damaged file take the application down with the user's unsaved work.
