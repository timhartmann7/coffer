[workspace]
members = ["crates/vault-core", "crates/vault-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
