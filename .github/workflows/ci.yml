name: CI

on:
  # Branches only. A tag push runs this through the release workflow instead,
  # which needs it green before it builds anything, so without the filter the
  # whole suite would run twice for every tag.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The engine is where the round-trip suite lives, and it needs an external
  # KeePass implementation to compare against. That comes from apt, which is
  # why this half runs on Ubuntu even though Coffer only ships for macOS.
  engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the current stable toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # The round-trip suite is the point of the project, and it fails rather
      # than skips when keepassxc-cli is missing, so a rename of this package
      # cannot quietly delete the project's main test.
      - name: Install keepassxc-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends keepassxc
          keepassxc-cli --version

      - name: Install cargo tooling
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo install cargo-shear cargo-deny --locked

      - name: Format
        run: cargo fmt --all --check

      # install.sh is the one file in this repository a stranger executes, and
      # the one file with no compiler behind it. The workflows are the other
      # thing here that nothing compiles, and the release one has never run.
      - name: Shell and workflows
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck install.sh assets/appicon.sh crates/vault-core/tests/fixtures/generate.sh

          # Every actionlint asset carries its version in its own name, so there
          # is nothing at /latest/download to ask for: the version comes off the
          # redirect first, the same way install.sh finds a release, and the
          # download is checked against the sums published beside it.
          latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            https://github.com/rhysd/actionlint/releases/latest)
          version=${latest##*/v}
          base=https://github.com/rhysd/actionlint/releases/download/v$version

          asset=actionlint_${version}_linux_amd64.tar.gz
          work=$(mktemp -d)
          curl -fsSL -o "$work/$asset" "$base/$asset"
          curl -fsSL -o "$work/sums" "$base/actionlint_${version}_checksums.txt"
          (cd "$work" && sha256sum --check --ignore-missing sums && tar xzf "$asset" actionlint)

          "$work/actionlint"

      - name: The installer refuses a machine that is not a Mac
        run: |
          if bash install.sh; then
            echo "install.sh ran to completion on Linux" >&2
            exit 1
          fi

      - name: Clippy
        run: cargo clippy -p vault-core --all-targets --all-features -- -D warnings

      - name: Unused dependencies
        run: cargo shear

      # The policy is written for the two targets Coffer ships, so it runs the
      # same way here as it would on a Mac.
      - name: Licences and banned crates
        run: cargo deny check

      # The escape hatch the macOS job uses must never reach this one: it turns
      # every comparison against an outside implementation into an early return,
      # and the suite would go green having checked nothing that matters.
      - name: Tests, including the round-trip suite
        run: |
          if [ -n "${COFFER_SKIP_KEEPASSXC:-}" ]; then
            echo "the round-trip criterion cannot be skipped in this job" >&2
            exit 1
          fi
          cargo nextest run -p vault-core --all-features

  # The window is macOS only: it talks to AppKit for the pasteboard, for opening
  # an address and for the title bar, and `vault-gui` does not compile anywhere
  # else on purpose.
  window:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the current stable toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend
        working-directory: frontend
        run: npm ci

      - name: Types
        working-directory: frontend
        run: npm run check

      - name: Format and lint
        working-directory: frontend
        run: npm run lint

      - name: Unused files, exports and dependencies
        working-directory: frontend
        run: npx knip

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # The window embeds the built frontend at compile time, so it has to exist
      # before anything Rust is built.
      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - name: Install cargo tooling
        run: curl -LsSf https://get.nexte.st/latest/mac | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The round-trip suite is the Ubuntu job's, because that is where an
      # external implementation of the format comes from apt. Here the same
      # tests would find no `keepassxc-cli` and stop the run - deliberately, so
      # that a renamed package cannot quietly delete the project's main test.
      # What this job is for is the half that only compiles on a Mac.
      - name: Tests
        env:
          COFFER_SKIP_KEEPASSXC: '1'
        run: cargo nextest run --workspace --all-features

      # Written as `if ... then exit 1` rather than with a `!`, because bash
      # exempts an inverted command from `set -e` and both lines would then
      # assert nothing at all. The first refusal happens before any request is
      # made; the second is a real one, refused by a release that is not there.
      - name: The installer refuses a version that is not one
        run: |
          if COFFER_VERSION=not-a-version bash install.sh; then
            echo "install.sh accepted a version that is not one" >&2
            exit 1
          fi
          if COFFER_VERSION=0.0.0 bash install.sh; then
            echo "install.sh accepted a release that is not there" >&2
            exit 1
          fi
          test ! -e /Applications/Coffer.app
